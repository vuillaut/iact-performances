schema_version: "0.2"
# One entry per analysis chain or production a user would want to select or
# compare. Records name one of these ids in their `analysis` field.
# Reuse an id across sources when it is the same analysis (e.g. a future
# prod5-official for every record of the official CTAO Prod5 IRFs).
analyses:
  - id: magic-mars-standard
    name: MAGIC standard analysis (MARS)
    description: >-
      Standard MAGIC stereo analysis with MARS: Random Forest gamma/hadron
      separation (Hadronness), DISP direction reconstruction, look-up-table
      energy estimation.
    references:
      - 10.1016/j.astropartphys.2015.02.005

  - id: ctapipe-hillas-rf
    name: Hillas / Random Forest (ctapipe)
    description: >-
      Geometric direction reconstruction from the Hillas parameters and
      Random Forest energy regression, in ctapipe. In Schwefer et al. 2024 it
      is also the seed of the ImPACT and FreePACT likelihood fits.
    references:
      - 10.1016/j.astropartphys.2024.103008

  - id: impact
    name: ImPACT
    description: >-
      Image Pixel-wise fit for Atmospheric Cherenkov Telescopes: likelihood
      fit of the camera images to image templates generated from Monte Carlo
      simulations (Parsons and Hinton 2014). Variants and settings (mono or
      stereo fit for H.E.S.S. II, analytical convolved pixel charge PDF in
      Schwefer et al. 2024) are given in the record conditions.
    references:
      - 10.1016/j.astropartphys.2014.03.002
      - 10.1016/j.astropartphys.2024.103008
      - 10.22323/1.236.0826

  - id: hillas-tmva
    name: H.E.S.S. Hillas reconstruction with TMVA background rejection
    description: >-
      H.E.S.S. stereoscopic reconstruction from the Hillas parameters of the
      cleaned images, with gamma/hadron separation by boosted decision trees
      (TMVA) trained on Monte Carlo gamma rays and off-source data
      (Ohm et al. 2009). The cut set (standard, hard) is given in the record
      conditions.
    references:
      - 10.1016/j.astropartphys.2009.04.001

  - id: freepact
    name: FreePACT
    description: >-
      Likelihood fit of the camera images where the per-pixel likelihood is
      learned by a neural network (neural ratio estimation), seeded by the
      Hillas / Random Forest reconstruction.
    references:
      - 10.1016/j.astropartphys.2024.103008

  - id: impact-freepact-templates
    name: ImPACT with FreePACT templates
    description: >-
      ImPACT likelihood fit using templates generated from the FreePACT
      neural network models instead of classical template simulations.
    references:
      - 10.1016/j.astropartphys.2024.103008

  - id: schwefer2024-event-selection
    name: Event selection of Schwefer et al. 2024
    description: >-
      Image quality cuts common to all the reconstruction methods of
      Schwefer et al. 2024 (tail-cuts 10/5 p.e., intensity > 50 p.e.,
      leakage < 10 %, centroid within 3 deg, at least 4 images), before any
      reconstruction and gamma/hadron separation. Used for the effective
      area, which does not depend on the reconstruction method.
    references:
      - 10.1016/j.astropartphys.2024.103008

  - id: prod5-official
    name: CTAO Prod5 v0.1 official IRFs (Eventdisplay)
    description: >-
      Official CTAO instrument response functions of the Prod5 production
      (Alpha configuration), from the Eventdisplay analysis with BDT
      gamma/hadron separation; cuts optimised for point-source flux
      sensitivity, separately per energy bin and observation time.
    references:
      - 10.5281/zenodo.5499840

  - id: prod6-official
    name: CTAO Prod6 v1.0 official IRFs (Eventdisplay + Eventdisplay-ML)
    description: >-
      Official CTAO instrument response functions of the Prod6 production
      (Beta configuration), from Eventdisplay v5.17.0 with the
      Eventdisplay-ML v1.0.0 stereo reconstruction; cuts optimised for
      point-source flux sensitivity, separately per energy bin and
      observation time.
    references:
      - 10.5281/zenodo.22871179

  - id: lstchain-srcindep
    name: cta-lstchain source-independent analysis
    description: >-
      Monoscopic LST-1 analysis with cta-lstchain (random forests for energy,
      direction via disp and gamma/hadron separation), not using the
      position of the source; selection with gammaness and theta cuts.
    references:
      - 10.3847/1538-4357/ace89d

  - id: gphysnet
    name: gamma-PhysNet (GammaLearn)
    description: >-
      Multitask deep-learning full-event reconstruction of GammaLearn for the
      LST-1: a ResNet backbone with attention feeding heads for the particle
      class, energy, arrival direction and impact point. The training variant
      (vanilla or a domain-adaptation method) is given in the record
      conditions.
    references:
      - 10.1109/CBMI50038.2021.9461918
      - 10.1016/j.ascom.2026.101176

  - id: lstchain-srcdep
    name: cta-lstchain source-dependent analysis
    description: >-
      Monoscopic LST-1 analysis with cta-lstchain using the known position of
      the source in the reconstruction and classification; selection with
      gammaness and alpha cuts. No angular resolution can be defined.
    references:
      - 10.3847/1538-4357/ace89d

  - id: a-scisoft
    name: A-SciSoft standard analysis (ASTRI)
    description: >-
      Standard reconstruction of A-SciSoft, the scientific software of the
      ASTRI Project: random forests for gamma/hadron separation and energy,
      arrival direction from the intersection of the image major axes; cuts
      on gammaness, direction and multiplicity optimised for the flux
      sensitivity in each energy and off-axis bin. The A-SciSoft version and
      the cut optimisation are given in the record conditions.
    references:
      - 10.22323/1.395.0884
      - 10.5281/zenodo.6827882

  - id: veritas-standard
    name: VERITAS standard analysis (box cuts)
    description: >-
      Standard VERITAS stereoscopic analysis: moment (Hillas) parametrisation
      of the cleaned images, gamma/hadron separation with box cuts on the
      scaled parameters, energy from look-up tables. Three a-priori cut sets
      (soft, medium, hard; given in the record conditions) are provided by
      both VERITAS analysis packages (VEGAS and a second one); which package
      made a curve is given in the record conditions when the source says.
    references:
      - https://arxiv.org/abs/0709.4006
      - https://arxiv.org/abs/0709.4233
      - 10.22323/1.236.0771

  - id: veritas-bdt
    name: VERITAS boosted decision trees
    description: >-
      VERITAS analysis with gamma/hadron separation by boosted decision trees
      (TMVA) trained on simulated gamma rays and real background events as a
      function of energy and elevation, using the standard Hillas parameters
      (Park et al. 2015, second analysis package).
    references:
      - https://arxiv.org/abs/physics/0703039
      - 10.22323/1.236.0771
