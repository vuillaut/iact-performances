refereed: false
instruments: [ctao]
reproducible: true
notes: >-
  Official curves from the ROOT files of the full Zenodo bundle
  (cta-prod5-zenodo-v0.1.zip), read by extract.py: for every site, array and
  sub-array (North: 4 LSTs + 9 MSTs, LSTs only, MSTs only; South: 14 MSTs +
  37 SSTs, MSTs only, SSTs only), zenith angle (20, 40, 60 deg) and
  optimisation time (50 h, 5 h, 30 min), azimuth-averaged pointing, the
  histograms behind the official figures: differential sensitivity
  (DiffSens, E^2 dN/dE), angular resolution (68 % containment, AngResEtrue
  vs true and AngRes vs reconstructed energy; the official figure uses
  reconstructed energy), energy resolution (ERes), effective area vs true
  energy with and without direction cut, residual background rate per
  square degree. The main histograms are on axis (point-source gamma rays
  on the camera axis), unlike the FITS IRFs, which describe 0-1 deg.
  Sensitivity criteria from the archived release web page (Website.md):
  5 standard deviations, at least 10 gamma rays per bin, signal/background
  at least 1/20, five bins per decade; the significance formula is not
  stated. ERes has no energy type on its axis and its y axis is labelled
  "RMS" in the file; the archived web page defines it as the half-width of
  the interval around 0 containing 68 % of (E_R - E_T)/E_T and plots it
  against reconstructed energy, which the records follow. Empty bins (0 in
  the file, meaning no value) are dropped. Not extracted: North- and
  South-pointing azimuths, off-axis histograms, integral sensitivity,
  sensitivity in Crab units, energy bias, migration matrices and PSF.
